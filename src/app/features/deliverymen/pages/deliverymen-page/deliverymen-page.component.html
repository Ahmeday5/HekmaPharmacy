<section class="page">
  <app-page-header title="إدارة المندوبين" subtitle="بيانات المندوبين وحالتهم اللحظية وإرسال التنبيهات"
    icon="fa-motorcycle">
    <button type="button" class="btn btn-brand-primary" (click)="formModal.openCreate()">
      <i class="fa-solid fa-plus"></i> إضافة مندوب
    </button>
  </app-page-header>

  <div class="stats-grid">
    <app-stat-card label="إجمالي المندوبين" icon="fa-users" tone="primary" [value]="stats().total" />
    <app-stat-card label="متاحين الآن" icon="fa-circle-check" tone="success" [value]="stats().available"
      [progress]="stats().availableRate" hint="جاهزين لاستلام طلبات" />
    <app-stat-card label="خارج الخدمة" icon="fa-user-slash" tone="danger" [value]="stats().offline"
      hint="غير متاحين حاليًا" />
    <app-stat-card label="بموقع مباشر" icon="fa-location-crosshairs" tone="info" [value]="stats().tracked"
      hint="بيبعتوا موقعهم لحظيًا" />
  </div>

  <app-list-view [list]="list" itemLabel="مندوب" [filterLabels]="{ name: 'الاسم', email: 'البريد' }">
    <app-search-input listFilters placeholder="ابحث باسم المندوب..." [value]="list.filters().name"
      (search)="list.updateFilters({ name: $event })" />
    <app-search-input listFilters placeholder="ابحث بالبريد الإلكتروني..." [value]="list.filters().email"
      (search)="list.updateFilters({ email: $event })" />

    <app-data-table [columns]="columns" [rows]="rows()" [loading]="list.loading()"
      [skeletonRowCount]="list.pageSize()" [errorMessage]="list.error()" [rowOffset]="list.rowOffset()"
      [editable]="true" [deletable]="true"
      [emptyMessage]="list.hasFilters() ? 'لا يوجد مندوبين يطابقون البحث' : 'لا يوجد مندوبين بعد — ابدأ بإضافة أول مندوب'"
      (edit)="formModal.openEdit($event)" (remove)="remove($event)">
      <ng-template appTableCell="deliveryman" let-deliveryman>
        <button type="button" class="entity-button" (click)="imagePreview.set(deliveryman)"
          [attr.aria-label]="'عرض صورة ' + deliveryman.name">
          <app-entity-cell [title]="deliveryman.name" [subtitle]="deliveryman.email" subtitleDir="ltr"
            [imageUrl]="deliveryman.imageUrl | apiAsset" />
        </button>
      </ng-template>
      <ng-template appTableCell="code" let-deliveryman>
        <span class="code-chip">#{{ deliveryman.id }}</span>
      </ng-template>
      <ng-template appTableCell="status" let-deliveryman>
        <app-availability-badge [available]="deliveryman.isAvailable" />
      </ng-template>
      <ng-template appTableCell="notify" let-deliveryman>
        <app-notify-button [deliveryman]="deliveryman" />
      </ng-template>
    </app-data-table>
  </app-list-view>
</section>

@if (formModal.isOpen()) {
<app-deliveryman-form-modal [entity]="formModal.entity()" (closed)="formModal.close()" (saved)="onSaved()" />
}

@if (imagePreview(); as deliveryman) {
<app-modal size="md" icon="fa-image" [title]="deliveryman.name" (closed)="imagePreview.set(null)">
  <div class="image-preview">
    @if (deliveryman.imageUrl | apiAsset; as imageUrl) {
    <img [src]="imageUrl" [alt]="deliveryman.name">
    } @else {
    <p class="text-muted-soft">لا توجد صورة لهذا المندوب</p>
    }
  </div>
</app-modal>
}
