<section class="page">
  <app-page-header [title]="greeting" subtitle="ملخص عمليات التوصيل لحظة بلحظة" icon="fa-gauge-high">
    <button type="button" class="btn btn-brand-primary" (click)="orderModalOpen.set(true)">
      <i class="fa-solid fa-plus"></i> إنشاء طلب جديد
    </button>
  </app-page-header>

  <!-- مؤشرات سريعة -->
  <div class="stats-grid">
    <app-stat-card label="طلبات اليوم" icon="fa-box" tone="primary" [value]="todayOrders()"
      hint="من الداتا بيز الرئيسية" />
    <app-stat-card label="قيد التوصيل" icon="fa-truck-fast" tone="info" [value]="inDeliveryOrders()?.length ?? null"
      hint="في الطريق للعملاء الآن" />
    <app-stat-card label="مندوبين متاحين" icon="fa-motorcycle" tone="success" [value]="availableCount()"
      [progress]="availabilityRate()"
      [hint]="availabilityRate() !== null ? availabilityRate() + '% من ' + totalDeliverymen() + ' مندوب' : ''" />
    <app-stat-card label="خارج الخدمة" icon="fa-user-slash" tone="danger" [value]="offlineCount()"
      hint="غير متاحين لاستلام طلبات" />
  </div>

  <!-- الخريطة: صف كامل لوحدها وبارتفاع ثابت -->
  <app-live-map class="dashboard-map" [deliverymen]="deliverymen()" />

  <!-- النشاط -->
  <div class="cards-section">
    <div class="cards-grid">
      <app-deliverymen-card [deliverymen]="deliverymen()" />
      <app-in-delivery-orders-card [orders]="inDeliveryOrders()" />
      <app-recent-orders-card [orders]="recentOrders().orders" [error]="recentOrders().error" />
    </div>
  </div>
</section>

@if (orderModalOpen()) {
<app-order-form-modal (closed)="orderModalOpen.set(false)" (saved)="onOrderCreated()" />
}
