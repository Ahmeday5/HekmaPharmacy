<section class="page">
  <app-page-header title="إدارة المستخدمين" subtitle="حسابات وصلاحيات مستخدمي لوحة التحكم" icon="fa-user-shield">
    <button type="button" class="btn btn-brand-primary" (click)="formModal.openCreate()">
      <i class="fa-solid fa-plus"></i> إضافة مستخدم
    </button>
  </app-page-header>

  <app-list-view [list]="list" itemLabel="مستخدم" [filterLabels]="filterLabels" [filterFormatters]="filterFormatters">
    <app-search-input listFilters placeholder="ابحث بالاسم أو البريد الإلكتروني..." [value]="list.filters().search"
      (search)="list.updateFilters({ search: $event })" />
    <app-segmented-control listFilters ariaLabel="فلترة حسب الدور" [options]="roleOptions"
      [value]="list.filters().role" (valueChange)="list.updateFilters({ role: $event })" />

    <app-data-table [columns]="columns" [rows]="list.items()" [loading]="list.loading()"
      [skeletonRowCount]="list.pageSize()" [errorMessage]="list.error()" [rowOffset]="list.rowOffset()"
      [editable]="true" [deletable]="true"
      [emptyMessage]="list.hasFilters() ? 'لا يوجد مستخدمين يطابقون الفلاتر' : 'لا يوجد مستخدمين بعد'"
      (edit)="formModal.openEdit($event)" (remove)="remove($event)">
      <ng-template appTableCell="user" let-admin>
        <app-entity-cell [title]="admin.userName || admin.email" [subtitle]="admin.email" subtitleDir="ltr" />
      </ng-template>

      <ng-template appTableCell="role" let-admin>
        <span class="badge-status" [class.badge-success]="admin.role === 'Admin'"
          [class.badge-info]="admin.role === 'Editor'" [class.badge-neutral]="!admin.role">
          {{ roleLabel(admin.role) }}
        </span>
      </ng-template>
    </app-data-table>
  </app-list-view>
</section>

@if (formModal.isOpen()) {
<app-admin-form-modal [entity]="formModal.entity()" (closed)="formModal.close()" (saved)="onSaved()" />
}
