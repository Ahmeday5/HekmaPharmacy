<section class="page">
  <app-page-header title="إدارة العملاء" subtitle="بيانات التواصل والعناوين ومواقع العملاء" icon="fa-users">
    <button type="button" class="btn btn-brand-primary" (click)="formModal.openCreate()">
      <i class="fa-solid fa-plus"></i> إضافة عميل
    </button>
  </app-page-header>

  <app-list-view [list]="list" itemLabel="عميل" [filterLabels]="{ name: 'اسم العميل' }">
    <app-search-input listFilters placeholder="ابحث باسم العميل..." [value]="list.filters().name"
      (search)="list.updateFilters({ name: $event })" />

    <app-data-table [columns]="columns" [rows]="list.items()" [loading]="list.loading()"
      [skeletonRowCount]="list.pageSize()" [errorMessage]="list.error()" [rowOffset]="list.rowOffset()"
      [editable]="true" [deletable]="true"
      [emptyMessage]="list.hasFilters() ? 'لا يوجد عملاء يطابقون البحث' : 'لا يوجد عملاء بعد — ابدأ بإضافة أول عميل'"
      (edit)="formModal.openEdit($event)" (remove)="remove($event)">
      <ng-template appTableCell="client" let-client>
        <app-entity-cell [title]="client.name" [subtitle]="client.clientCode ? 'كود: ' + client.clientCode : null" />
      </ng-template>

      <ng-template appTableCell="phones" let-client>
        <div class="cell-stack">
          <a class="cell-link" dir="ltr" [href]="'tel:' + client.phoneNumber">
            <i class="fa-solid fa-phone" aria-hidden="true"></i>{{ client.phoneNumber }}
          </a>
          @if (client.phoneNumber02) {
          <a class="cell-link" dir="ltr" [href]="'tel:' + client.phoneNumber02">
            <i class="fa-solid fa-phone" aria-hidden="true"></i><small>{{ client.phoneNumber02 }}</small>
          </a>
          }
        </div>
      </ng-template>

      <ng-template appTableCell="address" let-client>
        <div class="cell-stack">
          <span class="cell-truncate" [title]="client.address">{{ client.address || '—' }}</span>
          @if (client.address02) {
          <small class="cell-truncate" [title]="client.address02">{{ client.address02 }}</small>
          }
        </div>
      </ng-template>

      <ng-template appTableCell="location" let-client>
        @if (client.location) {
        <a class="btn btn-brand-outline btn-sm" [href]="client.location" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-location-dot"></i> فتح الخريطة
        </a>
        } @else {
        <span class="text-muted-soft">لا يوجد موقع</span>
        }
      </ng-template>
    </app-data-table>
  </app-list-view>
</section>

@if (formModal.isOpen()) {
<app-client-form-modal [entity]="formModal.entity()" (closed)="formModal.close()" (saved)="onSaved()" />
}
